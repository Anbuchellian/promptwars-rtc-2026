<!-- PathForge AI Official Vector Logo (Anvil + Career Trajectory Arrow + Compass) -->
<svg
  width="100%"
  height="100%"
  viewBox="0 0 200 200"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <!-- Turquoise Arrow & Compass Gradients / Shading -->
    <linearGradient id="pf-arrow-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00A896" />
      <stop offset="100%" stop-color="#1FD1BE" />
    </linearGradient>
    <linearGradient id="pf-arrow-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00756E" />
      <stop offset="100%" stop-color="#009688" />
    </linearGradient>
    
    <!-- Burgundy Anvil Highlights -->
    <linearGradient id="pf-burgundy-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6E1834" />
      <stop offset="100%" stop-color="#541026" />
    </linearGradient>
    <linearGradient id="pf-horn-highlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#832141" />
      <stop offset="100%" stop-color="#62142E" />
    </linearGradient>
  </defs>

  <!-- 1. COMPASS & NAVIGATION DIAL (Behind Anvil & Arrow) -->
  <g id="compass">
    <!-- Compass Arc / Dial Ring -->
    <path
      d="M 80 82 A 22 22 0 0 1 120 82"
      fill="none"
      stroke="#00A896"
      stroke-width="4.5"
      stroke-linecap="round"
    />
    <!-- Vertical Compass Needle (North / Navigation) -->
    <!-- Left Dark Half -->
    <polygon points="100,58 95,84 100,80" fill="#00796B" />
    <!-- Right Light Half -->
    <polygon points="100,58 105,84 100,80" fill="#14B8A6" />
    <!-- Center Needle Point (Lower) -->
    <polygon points="100,80 97,94 100,92" fill="#00796B" />
    <polygon points="100,80 103,94 100,92" fill="#14B8A6" />
  </g>

  <!-- 2. ANVIL (Deep Burgundy #6D1A36 / #541026) -->
  <g id="anvil">
    <!-- Left Horn & Body -->
    <path
      d="M 72 90
         L 51 90
         C 46 90, 43 94, 46 98
         C 53 107, 63 110, 71 113
         L 71 123
         L 64 135
         L 76 135
         L 78 120
         L 78 90
         Z"
      fill="url(#pf-burgundy-body)"
    />
    <!-- Left Horn Top Highlight Bevel -->
    <path
      d="M 50 92
         C 47 93, 49 95, 53 96
         C 60 97, 68 97, 72 96
         L 72 92
         Z"
      fill="#8C2548"
      opacity="0.85"
    />

    <!-- Right Horn, Waist & Base -->
    <path
      d="M 94 145
         L 125 145
         C 127 145, 131 142, 126 138
         C 120 132, 117 126, 119 116
         C 120 109, 124 104, 136 100
         C 147 96, 149 92, 145 90
         L 122 90
         L 122 98
         L 115 102
         L 94 136
         Z"
      fill="url(#pf-burgundy-body)"
    />
    <!-- Right Horn Top Highlight Bevel -->
    <path
      d="M 124 92
         L 143 92
         C 145 93, 144 95, 138 96
         C 131 97, 124 97, 122 96
         Z"
      fill="#8C2548"
      opacity="0.85"
    />
    <!-- Center Top Step Behind Arrow -->
    <rect x="73" y="86" width="20" height="6" fill="#60142C" rx="1" />
    <rect x="114" y="86" width="10" height="6" fill="#60142C" rx="1" />
  </g>

  <!-- 3. UPWARD CAREER TRAJECTORY ARROW (Turquoise / Teal 3D Facet) -->
  <g id="trajectory-arrow">
    <!-- Arrow Left Facet (Dark Teal) -->
    <!-- Base Foot & Shaft Left -->
    <path
      d="M 68 145
         L 81 145
         L 109 95
         L 96 95
         Z"
      fill="#00796B"
    />
    <!-- Shaft Mid/Upper Left -->
    <path
      d="M 81 145
         L 86 145
         L 117 88
         L 112 88
         Z"
      fill="#00897B"
    />
    <!-- Arrowhead Left Half -->
    <path
      d="M 112 88
         L 108 92
         L 128 58
         L 121 78
         Z"
      fill="#00796B"
    />

    <!-- Arrow Right Facet (Bright Turquoise / Cyan) -->
    <!-- Shaft Right Side -->
    <path
      d="M 86 145
         L 96 145
         L 127 88
         L 117 88
         Z"
      fill="url(#pf-arrow-light)"
    />
    <!-- Arrowhead Right Half -->
    <path
      d="M 128 58
         L 132 82
         L 124 78
         L 127 88
         L 117 88
         Z"
      fill="#1DE9B6"
    />
  </g>
</svg>